# Postgres for local development and for the backend test suite.
#
# The suite expects a database on port 5433 (see backend/.env.test), which is
# deliberately not 5432 so it can never point at a real local Postgres holding
# development data.
#
#   docker compose up -d db
#   cd backend && npx prisma migrate deploy && npm test
services:
  db:
    image: postgres:16-alpine
    container_name: parkmitra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: parkmitra
      POSTGRES_DB: parkmitra_test
      # Local-only fixture database; the connection string in .env.test carries
      # no password, so trust auth keeps the two consistent.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - '5433:5432'
    volumes:
      - parkmitra-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U parkmitra -d parkmitra_test']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  parkmitra-pgdata:
